name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }

      - name: Set version from run number
        run: |
          # Override version only inside the CI workspace (not committed)
          jq --arg v "0.0.${{ github.run_number }}" '.version = $v' \
            src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

      - name: Vet and test Go
        run: |
          go vet ./...
          go test ./...

      - name: Build Go sidecar
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries
          CGO_ENABLED=0 go build -ldflags="-s -w" -o "src-tauri/binaries/gitcord-server-$TRIPLE" .

      - name: Build Tauri app
        run: |
          npm install
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: gitcord-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          # Every push to main becomes a numbered build release
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Gitcord build #${{ github.run_number }} (${{ steps.sha.outputs.short }})"
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
