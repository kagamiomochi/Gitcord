<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Gitcord</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg0:#1e1f22;--bg1:#2b2d31;--bg2:#313338;--bg3:#383a40;--tx:#dbdee1;--mu:#949ba4;--ac:#5865f2;--warn:#f0b232;--ok:#23a559;--err:#f23f43}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg2);color:var(--tx);font:14px/1.45 system-ui,"Noto Sans JP",sans-serif;display:grid;grid-template-columns:240px minmax(0,1fr) 360px;overflow:hidden}
button{font:inherit;color:inherit;background:var(--bg3);border:0;border-radius:4px;padding:6px 10px;cursor:pointer}
button:hover{filter:brightness(1.2)}button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--ac);color:#fff}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
#side{background:var(--bg1)}#side h3,#right .tabs{margin:0;padding:12px;border-bottom:1px solid var(--bg0);display:flex;justify-content:space-between;align-items:center;font-size:14px}
#repos{overflow:auto;flex:1;padding:6px}
.repo{padding:8px;border-radius:4px;cursor:pointer;display:flex;gap:8px;align-items:center}
.repo:hover,.repo.on{background:var(--bg3)}
.av{width:32px;height:32px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-weight:700;flex:none}
.repo small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
#head{padding:12px 16px;border-bottom:1px solid var(--bg0);font-weight:600}
#msgs{flex:1;overflow:auto;padding:8px 0}
.c{padding:6px 16px 6px 13px;border-left:3px solid transparent;display:flex;gap:12px;cursor:pointer}
.c:hover{background:#2e3035}.c.sel{background:#35373d}
.c.up{border-left-color:var(--warn);background:rgba(240,178,50,.08)}
.c .m{min-width:0}.c b{margin-right:8px}.c time{color:var(--mu);font-size:12px}
.c code{color:var(--mu);font-size:12px}.tag{color:var(--warn);font-size:12px;margin-left:6px}
.first{text-align:center;color:var(--mu);padding:16px}
#comp{padding:0 16px 16px}
#comp .box{background:var(--bg3);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px}
#comp textarea{background:transparent;border:0;outline:0;color:var(--tx);font:inherit;resize:none;height:44px}
.row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pf button.on{background:var(--ac);color:#fff}
.split{position:relative;display:flex}
.split #send{border-radius:4px 0 0 4px}
.split #sendm{border-radius:0 4px 4px 0;margin-left:1px;padding:6px 7px}
#sm{display:none;position:absolute;bottom:100%;left:0;margin-bottom:4px;background:var(--bg0);border-radius:6px;padding:4px;min-width:200px;white-space:nowrap;z-index:9}
#sm div{padding:6px 10px;border-radius:4px;cursor:pointer}#sm div:hover{background:var(--ac)}
#sm div.off{opacity:.4;pointer-events:none}
.sw{margin-left:auto;color:var(--mu);display:flex;gap:6px;align-items:center}
#right{background:var(--bg1)}
.tabs button{background:none;color:var(--mu)}.tabs button.on{color:var(--tx);border-bottom:2px solid var(--ac);border-radius:0}
#list{flex:1;overflow:auto;padding:8px;min-height:120px}
#dwrap{display:none;flex:none;min-width:0;height:45%;flex-direction:column;border-top:1px solid var(--bg0);border-bottom:1px solid var(--bg0)}
#dwrap .dh{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;background:var(--bg1);color:var(--mu);font-size:12px}
#diff{flex:1;min-width:0;min-height:0;margin:0;overflow:auto;background:var(--bg0);padding:8px 16px;font:12px/1.4 ui-monospace,monospace;white-space:pre}
#diff.file{counter-reset:ln}#diff.file>div::before{counter-increment:ln;content:counter(ln);display:inline-block;width:3.5em;margin-right:1em;text-align:right;color:var(--mu);user-select:none}
#diff>div{min-width:max-content}#diff .a{color:#57d98a;background:rgba(35,165,89,.12)}#diff .d{color:#ff7b7e;background:rgba(242,63,67,.12)}#diff .h{color:#7aa2ff}
.f{padding:2px 6px;border-radius:3px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.f:hover{background:var(--bg3)}.ic{width:15px;height:15px;flex:none}.chev{width:12px;height:12px;flex:none;transition:transform .12s}
#list .tb{display:flex;gap:4px;position:sticky;top:-8px;background:var(--bg1);padding:8px 0 6px;z-index:1}
#list .tb input{flex:1;min-width:0;background:var(--bg0);border:0;border-radius:4px;padding:5px 8px;color:var(--tx);font:inherit;font-size:12px;outline:0}
#list .tb button{font-size:11px;padding:4px 7px;color:var(--mu)}
.rev{display:flex;justify-content:space-between;gap:8px;color:var(--mu);font-size:12px;padding:2px 6px 6px}.rev .nm,.rev>span:last-child{white-space:nowrap}.rev button{font-size:11px;padding:3px 8px}
details>summary{list-style:none;display:flex;gap:6px;align-items:center;padding:3px 6px;border-radius:3px;cursor:pointer;white-space:nowrap}
details>summary::-webkit-details-marker{display:none}
details>summary:hover{background:var(--bg3)}
details[open]>summary .chev{transform:rotate(90deg)}
details>summary .ic,#fb .ic{color:#7e9cd8}
.kids{margin-left:12px;padding-left:6px;border-left:1px solid var(--bg3)}
.nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cn{margin-left:auto;padding-left:10px;color:var(--mu);font-size:11px}
.f.t{padding:3px 6px}.f.on{background:var(--bg3)}.sp{width:12px;flex:none}
.cf .cl{display:flex;gap:8px;align-items:baseline;min-width:0;flex:1}.cf .nm{font-weight:600}
.cf .dir{color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.chip{width:18px;height:18px;border-radius:3px;display:grid;place-items:center;font:700 11px monospace;flex:none;background:var(--bg3);color:var(--mu)}
.cM{color:var(--warn)}.cA,.cU{color:var(--ok)}.cD{color:var(--err)}.cR,.cC,.cT{color:#7aa2ff}
.st{font:11px monospace;color:var(--warn)}
#menu{position:fixed;background:var(--bg0);border-radius:6px;padding:4px;display:none;z-index:9;min-width:190px}
#menu div{padding:6px 10px;border-radius:4px;cursor:pointer}#menu div:hover{background:var(--ac)}
#menu .x{color:var(--err)}
#modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:8}
#modal .p{background:var(--bg2);border-radius:8px;width:560px;max-width:95vw;max-height:85vh;display:flex;flex-direction:column;padding:16px;gap:10px}
#modal input{background:var(--bg0);border:0;color:var(--tx);border-radius:4px;padding:7px;width:100%;font:inherit}
#fb{overflow:auto;height:280px;background:var(--bg1);border-radius:4px;padding:4px}
.badge{background:var(--ok);color:#fff;font-size:11px;border-radius:3px;padding:0 5px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--err);color:#fff;padding:8px 14px;border-radius:6px;display:none;max-width:80vw;white-space:pre-wrap;z-index:10}
.empty{color:var(--mu);padding:30px;text-align:center}
</style></head><body>
<div id="side" class="col"><h3>Gitディレクトリ<button onclick="openAdd()" title="追加">＋</button></h3><div id="repos"></div></div>
<div id="mid" class="col"><div id="head">Gitディレクトリを選択してください</div><div id="msgs"></div>
<div id="dwrap"><div class="dh"><span id="dname"></span><button onclick="closeDiff()">閉じる</button></div><pre id="diff"></pre></div>
<div id="comp"><div class="box">
<textarea id="msg" placeholder="コミットメッセージ (Ctrl+Enterで送信)"></textarea>
<div class="row2"><span class="split"><button class="pri" id="send" disabled onclick="act()">送信</button><button class="pri" id="sendm" disabled onclick="toggleSm(event)" title="送信オプション">&#9662;</button><div id="sm"><div id="smc" onclick="commitOnly()">commitのみ</div><div id="smp" onclick="pushOnly()">pushのみ</div></div></span>
<span class="pf row2" id="pf"></span>
<label class="sw"><input type="checkbox" id="tr" checked onchange="localStorage.tr=this.checked?1:0">英訳</label></div></div></div></div>
<div id="right" class="col"><div class="tabs"><span><button id="t0" class="on" onclick="tab(0)">変更</button><button id="t1" onclick="tab(1)">ファイル</button></span></div>
<div id="list"></div></div>
<div id="menu"></div><div id="toast"></div>
<div id="modal"><div class="p"><div><button id="m0" onclick="mtab(0)">既存を追加</button> <button id="m1" onclick="mtab(1)">cloneして追加</button></div>
<div id="clone" style="display:none"><input id="curl" placeholder="リポジトリURL"><br><br><input id="cname" placeholder="ディレクトリ名"></div>
<input id="path" onchange="browse(this.value)"><div id="fb"></div>
<div style="display:flex;gap:8px;justify-content:flex-end"><button onclick="closeM()">キャンセル</button><button class="pri" id="ok" onclick="confirmAdd()">追加</button></div></div></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICO={dir:'<svg class="ic" viewBox="0 0 16 16"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.2l1.4 1.5h6.4a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z" fill="currentColor"/></svg>',
file:'<svg class="ic" viewBox="0 0 16 16"><path d="M3.5 1.5h5.6l3.4 3.4v9a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1v-11.4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M9 1.7V5h3.3" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>',
chev:'<svg class="chev" viewBox="0 0 16 16"><path d="M6 3.5l4.5 4.5L6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
const EC={js:'#e5c34b',mjs:'#e5c34b',ts:'#4a9eff',tsx:'#4a9eff',html:'#e8764b',css:'#5aa9e6',json:'#c9a24b',md:'#8fa3b8',go:'#4fc3d9',mod:'#4fc3d9',rs:'#e0875a',toml:'#b0b0b0',yml:'#d27a7a',yaml:'#d27a7a',sh:'#6bcb77',py:'#5b9bd5',png:'#b57edc',svg:'#b57edc',jpg:'#b57edc'};
const extColor=n=>EC[(n.split('.').pop()||'').toLowerCase()]||'var(--mu)';
const PF=['feat','fix','docs','style','refactor','perf','test','chore','none'];
let S={busy:false,repos:[],cur:null,commits:[],up:new Set(),sel:null,pf:null,tab:0,mode:0,dir:''};
$('tr').checked=localStorage.tr!=='0';
async function A(p,b){const r=await fetch('/api/'+p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',5000)}
const T=f=>f().catch(e=>toast(e.message));
$('pf').innerHTML=PF.map(p=>`<button data-p="${p}" onclick="setPf('${p}')">${p}</button>`).join('');
function setPf(p){S.pf=p;document.querySelectorAll('#pf button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));upd()}
// The send button always commits then pushes; commit-only and push-only live in the dropdown
const canCommit=()=>!!(S.cur&&S.pf&&$('msg').value.trim());
function upd(){const c=canCommit();
$('send').disabled=S.busy||!c;
// Push-only does not need a commit message, so it only requires a selected repo
$('sendm').disabled=S.busy||!S.cur;
$('smc').classList.toggle('off',!c);
if($('sendm').disabled)$('sm').style.display='none'}
function act(){if($('send').disabled)return;doCommit(true)}
// Dropdown action: commit only, without pushing
function commitOnly(){$('sm').style.display='none';if(!canCommit()||S.busy)return;doCommit(false)}
// Dropdown action: push only, without committing
function pushOnly(){$('sm').style.display='none';if(!S.cur||S.busy)return;doPush()}
function toggleSm(e){e.stopPropagation();if($('sendm').disabled)return;const m=$('sm');m.style.display=m.style.display==='block'?'none':'block'}
// Refresh button states after the repo state changes
async function chk(){if(!S.cur)return;upd()}
$('msg').oninput=upd;$('msg').onkeydown=e=>{if(e.key==='Enter'&&e.ctrlKey)act()};
async function loadRepos(){S.repos=await A('repos');$('repos').innerHTML=S.repos.map(p=>`<div class="repo ${p===S.cur?'on':''}" data-p="${esc(p)}" oncontextmenu="repoMenu(event,this.dataset.p)" onclick="pick(this.dataset.p)"><div class="av">${esc(p.split('/').pop()[0]||'?').toUpperCase()}</div><div><b>${esc(p.split('/').pop())}</b><small>${esc(p)}</small></div></div>`).join('')||'<div class="empty">＋で追加</div>'}
function repoMenu(e,p){e.preventDefault();menu(e,[['一覧から削除',()=>T(async()=>{await A('remove',{path:p});if(S.cur===p)S.cur=null;loadRepos()}),'x']])}
async function pick(p){S.cur=p;S.sel=null;$('head').textContent=p.split('/').pop();loadRepos();await refresh(true);}
async function refresh(bottom){if(!S.cur)return;const l=await A('log?repo='+encodeURIComponent(S.cur));S.commits=l.commits.reverse();S.up=new Set(l.unpushed);await chk();drawLog(bottom);drawRight()}
function drawLog(bottom){const m=$('msgs');const keep=m.scrollHeight-m.scrollTop;
m.innerHTML=(S.commits.length?'<div class="first">first commit</div>':'<div class="empty">コミットはまだありません</div>')+S.commits.map(c=>`<div class="c ${S.up.has(c.Hash)?'up':''} ${S.sel===c.Hash?'sel':''}" data-h="${c.Hash}" onclick="selC('${c.Hash}')" oncontextmenu="cMenu(event,'${c.Hash}')"><div class="av">${esc(c.Author[0]||'?')}</div><div class="m"><b>${esc(c.Author)}</b><time>${new Date(c.Time*1000).toLocaleString('ja-JP')}</time>${S.up.has(c.Hash)?'<span class="tag">未プッシュ</span>':''}<div>${esc(c.Subject)}</div><code>${c.Hash.slice(0,8)}</code></div></div>`).join('');
m.scrollTop=bottom?m.scrollHeight:m.scrollHeight-keep}
function selC(h){S.sel=S.sel===h?null:h;if(S.sel)S.tab=0;drawLog();tabs();drawRight()}
function cMenu(e,h){e.preventDefault();const run=(a,msg)=>()=>{if(msg&&!confirm(msg))return;T(async()=>{await A('action',{repo:S.cur,hash:h,action:a});await refresh();toast2('完了')})};
menu(e,S.up.has(h)?[['reset --soft (変更を残す・ステージ維持)',run('soft')],['reset --mixed (変更を残す)',run('mixed')],['reset --hard (変更を破棄)',run('hard','このコミットまで戻し、以降の変更を破棄します。よろしいですか?'),'x']]:[['revert (打ち消しコミットを作成)',run('revert')]])}
function toast2(m){const t=$('toast');t.style.background='var(--ok)';toast(m);setTimeout(()=>t.style.background='var(--err)',5200)}
function menu(e,items){const m=$('menu');m.innerHTML='';items.forEach(([l,f,c])=>{const d=document.createElement('div');d.textContent=l;if(c)d.className=c;d.onclick=()=>{m.style.display='none';f()};m.append(d)});m.style.left=Math.min(e.clientX,innerWidth-210)+'px';m.style.top=Math.min(e.clientY,innerHeight-items.length*34-10)+'px';m.style.display='block'}
document.addEventListener('click',()=>{$('menu').style.display='none';$('sm').style.display='none'});
function tab(n){S.tab=n;tabs();drawRight()}function tabs(){$('t0').classList.toggle('on',S.tab===0);$('t1').classList.toggle('on',S.tab===1)}
function closeDiff(){$('dwrap').style.display='none';$('diff').textContent=''}
async function drawRight(){const L=$('list');closeDiff();if(!S.cur){L.innerHTML='';return}
if(S.tab===0&&S.sel){await drawCommitChanges();return}
if(S.tab===0){const st=await A('status?repo='+encodeURIComponent(S.cur));
L.innerHTML=st.length?st.map((f,i)=>{const c=f.y!==' '?f.y:f.x,l=c==='?'?'U':c,k=f.path.lastIndexOf('/'),nm=f.path.slice(k+1),dr=k>=0?f.path.slice(0,k):'';return `<div class="f cf" onclick="showDiff(${i})"><input type="checkbox" ${f.staged?'checked':''} onclick="event.stopPropagation()" onchange="stage(${i},this.checked)"><span class="chip c${l}" title="${esc(f.x+f.y)}">${l}</span><span class="cl"><span class="nm">${esc(nm)}</span><span class="dir">${esc(dr)}</span></span></div>`}).join(''):'<div class="empty">未コミットの変更はありません</div>';S._st=st}
else{S._paths=(await A('tree?repo='+encodeURIComponent(S.cur)+(S.sel?'&rev='+S.sel:''))).filter(Boolean);
L.innerHTML=`<div class="tb"><input id="ff" placeholder="ファイルを絞り込み" value="${esc(S.q||'')}" oninput="S.q=this.value;drawTree()"><button onclick="fold(1)">すべて展開</button><button onclick="fold(0)">折りたたみ</button></div><div class="rev"><span>${S.sel?S.sel.slice(0,8)+'':'HEAD'}</span><span>${S._paths.length} ファイル</span></div><div id="tree"></div>`;drawTree()}}
// Changes tab for a selected past commit: list the files it touched; clicking one shows that commit's diff
async function drawCommitChanges(){const L=$('list'),h=S.sel,repo=S.cur;
const cs=await T(()=>A(`changes?repo=${encodeURIComponent(repo)}&rev=${h}`));
// Ignore the response if the selection or tab changed while it was loading
if(!Array.isArray(cs)||S.sel!==h||S.cur!==repo||S.tab!==0)return;
S._cs=cs;const c=S.commits.find(x=>x.Hash===h);
L.innerHTML=`<div class="rev"><span class="nm">${h.slice(0,8)} ${esc(c?c.Subject:'')}</span><span>${cs.length} ファイル</span></div><div class="rev"><button onclick="selC(S.sel)">未コミットの変更に戻る</button></div>`+
(cs.length?cs.map((f,i)=>{const k=f.path.lastIndexOf('/'),nm=f.path.slice(k+1),dr=k>=0?f.path.slice(0,k):'';
return `<div class="f cf" title="${esc(f.old?f.old+' → '+f.path:f.path)}" onclick="showCDiff(${i})"><span class="chip c${esc(f.status)}">${esc(f.status)}</span><span class="cl"><span class="nm">${esc(nm)}</span><span class="dir">${esc(dr)}</span></span></div>`}).join(''):'<div class="empty">このコミットで変更されたファイルはありません</div>')}
async function showCDiff(i){const f=S._cs[i],h=S.sel;
const t=await T(()=>A(`diff?repo=${encodeURIComponent(S.cur)}&rev=${h}&path=${encodeURIComponent(f.path)}`+(f.old?`&old=${encodeURIComponent(f.old)}`:'')));
if(typeof t!=='string')return;paint(t,f.path+'  @ '+h.slice(0,8))}
function fold(o){document.querySelectorAll('#tree details').forEach(d=>d.open=!!o)}
function drawTree(){const q=(S.q||'').toLowerCase(),root={};
(q?S._paths.filter(p=>p.toLowerCase().includes(q)):S._paths).forEach(p=>{let n=root;p.split('/').forEach((s,i,a)=>{n=n[s]??=(i===a.length-1?p:{})})});
const cnt=n=>Object.values(n).reduce((a,v)=>a+(typeof v==='object'?cnt(v):1),0);
const R=(n,d)=>Object.keys(n).sort((a,b)=>(typeof n[b]==='object')-(typeof n[a]==='object')||a.localeCompare(b)).map(k=>typeof n[k]==='object'?`<details ${d===0||q?'open':''}><summary>${ICO.chev}${ICO.dir}<span class="nm">${esc(k)}</span><span class="cn">${cnt(n[k])}</span></summary><div class="kids">${R(n[k],d+1)}</div></details>`:`<div class="f t ${S.file===n[k]?'on':''}" data-p="${esc(n[k])}" onclick="openFile(this.dataset.p)"><span class="sp"></span><span style="color:${extColor(k)};display:flex">${ICO.file}</span><span class="nm">${esc(k)}</span></div>`).join('');
$('tree').innerHTML=R(root,0)||'<div class="empty">'+(q?'一致するファイルがありません':'ファイルなし')+'</div>'}
async function stage(i,on){await T(async()=>{await A('stage',{repo:S.cur,paths:[S._st[i].path],stage:on});drawRight()})}
function paint(t,n){$('diff').classList.remove('file');$('dname').textContent=n;$('dwrap').style.display='flex';$('diff').scrollTop=0;$('diff').innerHTML=esc(t).split('\n').map(l=>`<div class="${l[0]==='+'&&!l.startsWith('+++')?'a':l[0]==='-'&&!l.startsWith('---')?'d':l.startsWith('@@')?'h':''}">${l||' '}</div>`).join('')}
async function showDiff(i){const f=S._st[i];paint(await A(`diff?repo=${encodeURIComponent(S.cur)}&path=${encodeURIComponent(f.path)}&staged=${f.staged&&f.y===' '?1:0}`),f.path)}
// Open a file from the file browser: show its content (at the selected commit, or HEAD) without diff coloring
async function openFile(p){S.file=p;document.querySelectorAll('#tree .f').forEach(e=>e.classList.toggle('on',e.dataset.p===p));
const t=await T(()=>A(`file?repo=${encodeURIComponent(S.cur)}&path=${encodeURIComponent(p)}&rev=${S.sel||'HEAD'}`));
if(typeof t!=='string')return;
$('diff').classList.add('file');$('dname').textContent=p+(S.sel?'  @ '+S.sel.slice(0,8):'');$('dwrap').style.display='flex';$('diff').scrollTop=0;
$('diff').innerHTML=esc(t.replace(/\n$/,'')).split('\n').map(l=>`<div>${l||' '}</div>`).join('')}
// push=true: commit then push (default), push=false: commit only
async function doCommit(push){T(async()=>{let m=$('msg').value.trim();if($('tr').checked&&/[^\x00-\x7f]/.test(m)){try{m=await A('translate',{text:m})}catch(e){if(!confirm('英訳に失敗しました: '+e.message+'\n原文のままコミットしますか?'))return}}
if(S.pf!=='none')m=S.pf+': '+m;
// Pin the target repo so switching repos mid-push cannot push the wrong one
const repo=S.cur;S.busy=true;upd();
try{await A('commit',{repo,message:m});$('msg').value='';S.pf=null;setPf(null);
if(push){await refresh(true);
// The commit already succeeded here, so a push failure must not look like a failed commit
try{await A('push',{repo});toast2('送信しました')}catch(e){toast('コミットは完了しましたが、pushに失敗しました:\n'+e.message)}}
}finally{S.busy=false;upd()}
await refresh(true)})}
function doPush(){if(!S.cur)return;T(async()=>{await A('push',{repo:S.cur});toast2('pushしました');refresh()})}
// add dialog
function openAdd(){$('modal').style.display='grid';mtab(0);browse('')}function closeM(){$('modal').style.display='none'}
function mtab(n){S.mode=n;$('clone').style.display=n?'block':'none';$('m0').className=n?'':'pri';$('m1').className=n?'pri':'';$('ok').textContent=n?'ここにclone':'このディレクトリを追加'}
async function browse(p){T(async()=>{const r=await A('ls?path='+encodeURIComponent(p));S.dir=r.path;$('path').value=r.path;
$('fb').innerHTML=`<div class="f" data-p="${esc(r.parent)}" onclick="browse(this.dataset.p)">..</div>`+r.entries.map(e=>`<div class="f" data-p="${esc(r.path.replace(/\/$/,'')+'/'+e.name)}" onclick="browse(this.dataset.p)">${ICO.dir}<span class="nm">${esc(e.name)}</span>${e.git?'<span class="badge" style="margin-left:auto">Git</span>':''}</div>`).join('');
$('ok').dataset.git=r.git?1:''})}
$('curl').oninput=()=>{if(!$('cname').dataset.u)$('cname').value=$('curl').value.replace(/\/+$/,'').split(/[\/:]/).pop().replace(/\.git$/,'')};$('cname').oninput=()=>$('cname').dataset.u=1;
function confirmAdd(){T(async()=>{if(S.mode){await A('clone',{url:$('curl').value.trim(),dir:S.dir,name:$('cname').value.trim()})}else await A('add',{path:S.dir});closeM();await loadRepos()})}
window.addEventListener('focus',()=>{if(S.cur)T(async()=>{await chk();if(S.tab===0&&!S.sel)drawRight()})});
loadRepos();
</script></body></html>
